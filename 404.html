<!DOCTYPE html>
<!--
  Note for coding agents and any other client that does not run JavaScript.

  If you came here looking for the Coddy Agent documentation, this 404 is expected
  and the page you want exists. Addresses under https://coddy.dev/docs/ have no HTML
  copy on this site: in a browser /docs-redirect.js sends the visitor on to GitHub,
  and a client without JavaScript stops at this page. Fetch the Markdown instead.

  Index of every documentation page:  https://coddy.dev/llms.txt
  All pages in one file:              https://coddy.dev/llms-full.txt

  One page, https://coddy.dev/docs/<path> or https://coddy.dev/docs/<path>.md, is
    https://raw.githubusercontent.com/coddy-project/coddy-agent/main/docs/<path>.md
  for example /docs/getting-started/quickstart is
    https://raw.githubusercontent.com/coddy-project/coddy-agent/main/docs/getting-started/quickstart.md
  /docs/AGENTS, /docs/CONTRIBUTING and /docs/DESIGN live in the repository root:
    https://raw.githubusercontent.com/coddy-project/coddy-agent/main/AGENTS.md
  /docs/ itself is the documentation start page:
    https://raw.githubusercontent.com/coddy-project/coddy-agent/main/docs/README.md

  Source repository: https://github.com/coddy-project/coddy-agent
-->
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found - Coddy Agent</title>
  <meta name="robots" content="noindex" />
  <!-- /docs/<path> is a stable address of a documentation page: the script sends
       the visitor to the page on GitHub (fragment kept) and /docs/<path>.md to its raw
       Markdown. Generated by `make site-docs` in coddy-project/coddy-agent. -->
  <script src="/docs-redirect.js"></script>
  <meta name="theme-color" content="#9333ea" />
  <link rel="icon" href="/assets/coddy-favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/assets/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <link rel="stylesheet" href="/styles.css?v=26" />
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner shell-width">
      <a class="logo" href="/" aria-label="Coddy agent home">
        <img class="logo-wordmark" src="/assets/coddy-logo-wordmark.svg" width="188" height="56" alt="Coddy agent" />
      </a>
    </div>
  </header>
  <main class="shell">
    <section class="hero">
      <h1>Page not found</h1>
      <p class="tagline">
        There is nothing at this address. The landing page, the install scripts, and the documentation are one hop away.
      </p>
      <p class="footer-links">
        <a href="/">Home</a>
        <a href="/#install">Install</a>
        <a href="/docs/">Docs</a>
        <a href="https://github.com/coddy-project/coddy-agent">GitHub</a>
      </p>
    </section>
  </main>
</body>
</html>
